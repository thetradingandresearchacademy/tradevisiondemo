<style>
body{
  margin:0;
  background:#0b1220;
  color:#e2e8f0;
  font-family:Inter,Arial;
  overflow:hidden;
}

.app{
  display:grid;
  grid-template-columns:220px 1fr 280px;
  grid-template-rows:1fr;
  height:100vh;
}

/* LEFT SIDEBAR */
.sidebar{
  background:#111827;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:12px;
  overflow-y:auto;
}

.sidebar input,

  width:100%;
  padding:6px 8px;
  border:none;
  border-radius:6px;
  background:#1f2937;
  color:white;
}

.sidebar button{
  padding:8px;
  border:none;
  border-radius:6px;
  background:#2563eb;
  color:white;
  cursor:pointer;
}

/* MAIN */
.main{
  display:flex;
  flex-direction:column;
  padding:16px;
}

.top-controls{
  display:flex;
  justify-content:space-between;
  align-items:center;

}

}

#sessionInfo{

  letter-spacing:0.5px;
}
.top-controls .control-group:last-child{

}

button{

  border:none;
  border-radius:6px;
  cursor:pointer;
}

.icon{background:#1f2937;color:white;}
.accent{background:#2563eb;color:white;}
.buy{background:#16a34a;color:white;}
.sell{background:#dc2626;color:white;}
.neutral{background:#334155;color:white;}

#chart{
  flex:1;

}

#headerBar{
  display:flex;

  margin-top:6px;
}

#tradePanel{
  margin-top:6px;
  font-weight:bold;
}

/* RIGHT ANALYTICS */
.analytics{
  background:#0f172a;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:16px;
  overflow-y:auto;

/* Section Headings */

  letter-spacing:0.5px;

}

/* Equity Panel */

  padding:12px;
  border-radius:10px;
  border:1px solid #1f2937;
}

#equityPanel canvas{
  width:100%;
  background:#0b1220;
  border-radius:6px;
}

/* Trade History Container */
#tradeLog{
  max-height:80px;   /* reduced further */
  overflow-y:auto;
  background:#0b1220;
  padding:10px;
  border-radius:10px;
  font-size:12px;
  border:1px solid #1f2937;
}

/* Smooth Scrollbar */
#tradeLog::-webkit-scrollbar{
  width:6px;
}

#tradeLog::-webkit-scrollbar-thumb{
  background:#334155;
  border-radius:4px;
}

#tradeLog::-webkit-scrollbar-track{
  background:transparent;
}
  .analytics-btn {
  width:100%;
  margin-bottom:10px;
  padding:6px;
  font-size:12px;
  background:#1f2937;
  border:1px solid #374151;
  color:#9ca3af;
  border-radius:6px;
  cursor:pointer;
}
.analytics-btn:hover {

  /* ============================= */
/* RESPONSIVE LAYOUT FOUNDATION */
/* ============================= */

/* DESKTOP DEFAULT */
.layout-desktop .app {
  display:grid;
  grid-template-columns:220px 1fr 280px;
}

/* TABLET */
.layout-tablet .app {
  display:grid;
  grid-template-columns:60px 1fr;
}

.layout-tablet .analytics {
  display:none;
}

/* MOBILE */
.layout-mobile .app {
  display:block;
}

/* Sidebar collapse */
.sidebar.collapsed {
  width:60px;
}

/* Mobile Sidebar Slide */
.layout-mobile .sidebar {
  position:fixed;
  top:0;
  left:0;
  height:100%;
  width:220px;
  z-index:1000;

  transition:transform 0.3s ease;
}

.layout-mobile .sidebar.open {

}

/* Mobile Analytics Drawer */
.layout-mobile .analytics {
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:60%;
  z-index:900;
  transform:translateY(100%);

  border-top-left-radius:16px;
  border-top-right-radius:16px;
}

.layout-mobile .analytics.open {
  transform:translateY(0);
}

/* Mobile Buttons */

<script>

// ===== PLAN ENTITLEMENT LAYER (MUST BE FIRST) =====

window.currentPlan = "free";

window.hasFeatureAccess = function(feature) {

  const plan = window.currentPlan || "free";

  const entitlements = {
    free: {
      institutional: false,
      extendedProjection: false,
      deepReport: false
    },
    pro: {
      institutional: true,
      extendedProjection: true,
      deepReport: true
    },
    premium: {
      institutional: true,
      extendedProjection: true,
      deepReport: true
    },
    admin: {
      institutional: true,
      extendedProjection: true,
      deepReport: true
    }
  };

  return entitlements[plan]?.[feature] ?? false;
};


// ===== START SIMULATION =====

window.startSimulation = async function(){

  const symbol = document.getElementById("symbol").value.trim();
  if(!symbol){
    alert("Please select a symbol.");
    return;
  }

if(!window.authReady){
  alert("System initializing... Please wait 2 seconds and try again.");
  return;
}

  const { data: sessionData } = await window.supabase.auth.getSession();
  if(!sessionData.session){
    alert("Session expired. Login again.");
    return;
  }

  const accessToken = sessionData.session.access_token;

  // ===== AUTHORITATIVE ACCESS + PLAN CHECK =====
  let accessData;

  try{
    const accessRes = await fetch("/api/check_access",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer " + accessToken
      },
      body: JSON.stringify({})
    });

    if(!accessRes.ok){
      const denied = await accessRes.json().catch(() => ({}));
      alert(denied.error || "Access not authorized.");
      return;
    }

    accessData = await accessRes.json();
  }catch(err){
    console.error("check_access error:", err);
    alert("Authorization unavailable. Please try again.");
    return;
  }

  window.currentPlan = accessData.plan || "free";
  const regime = document.getElementById("regime").value;
  const mode = document.getElementById("mode").value;
  const difficulty = document.getElementById("difficulty").value;
  const seedInput = document.getElementById("seedInput").value;
  const institutional = document.getElementById("institutionalModeToggle").checked;

  if(institutional && !window.hasFeatureAccess("institutional")){
    alert("Institutional Mode is not available on your current plan.");
    return;
  }

  const response = await fetch(
    "https://tfpscbilfwekzvvktinm.supabase.co/functions/v1/simulate",
    {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer "+accessToken
      },
      body: JSON.stringify({
        symbol,
        regime,
        length: Number(document.getElementById("lengthInput").value) || 100,
        seed: seedInput ? Number(seedInput) : null,
        mode,
        difficulty,
        institutionalMode: institutional
      })
    }
  );

  if(!response.ok){
    const text = await response.text();
    console.log("Simulation error:", text);
    alert("Simulation failed.");
    return;
  }

const result = await response.json();
// 🔒 Sync UI with backend enforced length
document.getElementById("lengthInput").value = result.simulated.length;
  
if (!Array.isArray(result.history) || !Array.isArray(result.simulated)) {
  console.error("Invalid simulation payload:", result);
  alert("Simulation data invalid.");
  return;
}

document.getElementById("symbolInfo").innerText =
  "Symbol: " + symbol + " | TF: 1D | Seed: " + result.seed;
initChart();
loadSimulationData(
  result.history,
  result.simulated
);

};
</script>

<!-- BRANDED SNAPSHOT -->
<script>
window.takeSnapshot = function(){

  if(!chart) return;

  const baseCanvas = chart.takeScreenshot();
  const footerHeight = 220;

  const canvas = document.createElement("canvas");
  canvas.width = baseCanvas.width;
  canvas.height = baseCanvas.height + footerHeight;

  const ctx = canvas.getContext("2d");

  ctx.drawImage(baseCanvas, 0, 0);

  // ---------- WATERMARK ----------
  ctx.save();
  ctx.globalAlpha = 0.04;
  ctx.translate(canvas.width/2, baseCanvas.height/2);
  ctx.rotate(-Math.PI/6);
  ctx.textAlign="center";
  ctx.font="bold 90px Inter, Arial";
  ctx.fillStyle="#ffffff";
  ctx.fillText("TradeVision by TARA",0,0);
  ctx.restore();

  // ---------- FOOTER BACKGROUND ----------
  const gradient = ctx.createLinearGradient(0, baseCanvas.height, 0, canvas.height);
  gradient.addColorStop(0, "#0f172a");
  gradient.addColorStop(1, "#020617");

  ctx.fillStyle = gradient;
  ctx.fillRect(0, baseCanvas.height, canvas.width, footerHeight);

  // ---------- LOAD LOGO ----------
  const logo = new Image();
  logo.src = "/TARA-LOGO.jpeg";

  logo.onload = function(){

    ctx.drawImage(logo, 30, baseCanvas.height+30, 120, 120);

    const symbol = document.getElementById("symbol").value || "N/A";
    const seed = document.getElementById("seedInput").value || "Auto";

    const total = tradeHistory.length;
    const wins = tradeHistory.filter(t=>t.pnl>0).length;
    const net = tradeHistory.reduce((a,b)=>a+b.pnl,0);

    ctx.fillStyle="#e2e8f0";
    ctx.font="bold 22px Inter, Arial";
    ctx.fillText("TradeVision™ — Regime-Aware Market Simulator", 180, baseCanvas.height+45);

    ctx.font="14px Inter, Arial";
    ctx.fillStyle="#94a3b8";
    ctx.fillText("Symbol: "+symbol, 180, baseCanvas.height+75);
    ctx.fillText("Seed: "+seed, 180, baseCanvas.height+95);
    ctx.fillText("Generated: "+new Date().toLocaleString(), 180, baseCanvas.height+115);

    // ---------- PERFORMANCE SUMMARY ----------
    ctx.textAlign="right";
    ctx.fillStyle="#e2e8f0";
    ctx.font="bold 16px Inter, Arial";
    ctx.fillText("Session Summary", canvas.width-40, baseCanvas.height+50);

    ctx.font="14px Inter, Arial";
    ctx.fillStyle="#94a3b8";
    ctx.fillText("Total Trades: "+total, canvas.width-40, baseCanvas.height+80);
    ctx.fillText("Win Rate: "+(total?((wins/total)*100).toFixed(1):0)+"%", canvas.width-40, baseCanvas.height+100);

    ctx.fillStyle = net>=0 ? "#22c55e" : "#ef4444";
    ctx.fillText("Net PnL: "+net.toFixed(2), canvas.width-40, baseCanvas.height+120);

    ctx.textAlign="right";
    ctx.fillStyle="#64748b";
    ctx.font="12px Inter, Arial";
    ctx.fillText("Confidential Simulation Output", canvas.width-40, baseCanvas.height+160);

    // ---------- EXPORT ----------
    const now = new Date();
    const timestamp = now.getFullYear()+"-"+(now.getMonth()+1)+"-"+now.getDate()+"_"+now.getHours()+"-"+now.getMinutes();

    const link = document.createElement("a");
    link.download = symbol+"_TradeVision_"+timestamp+".png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  };
};
</script>

<script>
// ================= PREMIUM REPORT LOGIC =================

window.showPerformanceReport = function(){

  if(!window.tradeHistory || !tradeHistory.length){
    alert("No trades yet.");
    return;
  }

  const symbol = document.getElementById("symbol").value || "N/A";
  const symbolInfo = document.getElementById("symbolInfo").innerText;

  const total = tradeHistory.length;
  const wins = tradeHistory.filter(t=>t.pnl>0).length;
  const net = tradeHistory.reduce((a,b)=>a+b.pnl,0);

  let equity=0,peak=0,maxDD=0;
  tradeHistory.forEach(t=>{
    equity+=t.pnl;
    peak=Math.max(peak,equity);
    maxDD=Math.max(maxDD,peak-equity);
  });

  const winRate = ((wins/total)*100).toFixed(1);
  const netColor = net>=0 ? "#22c55e" : "#ef4444";

  document.getElementById("reportStats").innerHTML = `
    <div style="margin-bottom:14px;color:#94a3b8;">${symbolInfo}</div>
    <div>Total Trades: <strong>${total}</strong></div>
    <div>Win Rate: <strong>${winRate}%</strong></div>
    <div>Net PnL: <strong style="color:${netColor}">${net.toFixed(2)}</strong></div>
    <div>Max Drawdown: <strong>${maxDD.toFixed(2)}</strong></div>
  `;

  document.getElementById("reportDate").innerText =
    new Date().toLocaleString();

  document.getElementById("reportModal").style.display="flex";
};


// ---------- CLOSE MODAL ----------
window.closeReport = function(){
  document.getElementById("reportModal").style.display="none";
};


// ---------- DOWNLOAD REPORT (AUTO CLOSE + BRANDED NAME) ----------
window.downloadReport = async function(){
await saveUserSession();
  const symbol = document.getElementById("symbol").value || "N/A";

  const canvas = await html2canvas(
    document.getElementById("reportContent")
  );

  const now = new Date();
  const timestamp =
    now.getFullYear()+"-"+(now.getMonth()+1)+"-"+now.getDate()+"_"+
    now.getHours()+"-"+now.getMinutes();

  const link = document.createElement("a");
  link.download = symbol+"_TradeVision_Report_"+timestamp+".png";
  link.href = canvas.toDataURL("image/png");
  link.click();

  // AUTO CLOSE AFTER DOWNLOAD
  document.getElementById("reportModal").style.display="none";
};

  async function saveUserSession(){

  if(!window.supabase) return;

  const { data: sessionData } = await window.supabase.auth.getSession();
  if(!sessionData || !sessionData.session) return;

  const accessToken = sessionData.session.access_token;

  const total = tradeHistory.length;
  const wins = tradeHistory.filter(t=>t.pnl>0).length;
  const net = tradeHistory.reduce((a,b)=>a+b.pnl,0);
  const winRate = total ? (wins/total)*100 : 0;

  const response = await fetch("/api/save_session",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization":"Bearer " + accessToken
    },
    body: JSON.stringify({
      symbol: window.currentSymbol || "N/A",
      total_trades: total,
      win_rate: winRate,
      net_pnl: net
    })
  });

  if(response.ok){
    console.log("Session saved");
    document.dispatchEvent(new Event("sessionSaved"));
  }else{
    const errorText = await response.text();
    console.error("Save failed:", errorText);
  }
}

</script>
